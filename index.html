        function startEggGameLoop() {
            stopEggGameLoop();
            eggCanvas.classList.remove('hidden');
            eggCanvas.width = 200;
            eggCanvas.height = 200;
            resetEggGameToTitle();
            eggState.lastTime = performance.now();

            const loop = (now) => {
                if (MODES[currentModeIdx].id !== 'egg_game') return;
                const dt = Math.min(0.05, (now - eggState.lastTime) / 1000);
                eggState.lastTime = now;

                updateEggGame(dt);
                renderEggGame();

                eggGameRaf = requestAnimationFrame(loop);
            };
            eggGameRaf = requestAnimationFrame(loop);
        }

        function stopEggGameLoop() {
            if (eggGameRaf) {
                cancelAnimationFrame(eggGameRaf);
                eggGameRaf = null;
            }
            eggState.moveLeft = false;
            eggState.moveRight = false;
            eggState.targetTouchX = null;
            eggCanvas.classList.add('hidden');
        }

        function spawnEggParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.4;
                const spd = 28 + Math.random() * 38;
                eggState.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd - 15,
                    life: 0.35 + Math.random() * 0.15,
                    maxLife: 0.5,
                    color
                });
            }
        }

        function updateEggGame(dt) {
            // Обновление частиц
            for (let i = eggState.particles.length - 1; i >= 0; i--) {
                const p = eggState.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 90 * dt;
                p.life -= dt;
                if (p.life <= 0) {
                    eggState.particles.splice(i, 1);
                }
            }

            if (eggState.phase === 'playing') {
                const speed = 122;
                let moving = false;

                if (eggState.targetTouchX !== null) {
                    const diff = eggState.targetTouchX - eggState.playerX;
                    if (Math.abs(diff) > 2) {
                        const step = Math.sign(diff) * Math.min(Math.abs(diff), speed * 1.35 * dt);
                        eggState.playerX += step;
                        eggState.playerDir = Math.sign(diff);
                        moving = true;
                    }
                } else {
                    if (eggState.moveLeft) {
                        eggState.playerX -= speed * dt;
                        eggState.playerDir = -1;
                        moving = true;
                    }
                    if (eggState.moveRight) {
                        eggState.playerX += speed * dt;
                        eggState.playerDir = 1;
                        moving = true;
                    }
                }

                eggState.playerX = Math.max(26, Math.min(174, eggState.playerX));
                if (moving) {
                    eggState.walkFrame += dt * 16;
                } else {
                    eggState.walkFrame = 0;
                }

                // Событие жуткого глаза в центре неба
                eggState.eyeTimer -= dt;
                if (eggState.eyeTimer <= 0) {
                    eggState.eyeAlpha = 1.0;
                    eggState.eyeTimer = 6.0 + Math.random() * 3.5;
                }
                if (eggState.eyeAlpha > 0) {
                    eggState.eyeAlpha = Math.max(0, eggState.eyeAlpha - dt * 0.45);
                }

                // Спавн яиц
                eggState.spawnTimer -= dt;
                if (eggState.spawnTimer <= 0) {
                    // Проклятые светящиеся бирюзовые яйца появляются чаще, когда открыт Глаз
                    const cursedChance = eggState.eyeAlpha > 0.25
                        ? 0.42
                        : Math.min(0.28, 0.12 + eggState.score * 0.0012);
                    const isCursed = Math.random() < cursedChance;
                    eggState.items.push({
                        x: 28 + Math.random() * 144,
                        y: 44,
                        vy: 56 + Math.min(72, eggState.score * 0.26) + Math.random() * 16,
                        type: isCursed ? 'cursed' : 'normal'
                    });
                    eggState.spawnTimer = Math.max(0.54, 1.15 - eggState.score * 0.0025);
                }

                const groundY = 158;
                const playerTopY = 138;

                for (let i = eggState.items.length - 1; i >= 0; i--) {
                    const it = eggState.items[i];
                    it.y += it.vy * dt;

                    // Проверка поимки игроком
                    const dx = Math.abs(it.x - eggState.playerX);
                    if (dx < 16 && it.y >= playerTopY && it.y <= groundY + 4) {
                        if (it.type === 'normal') {
                            eggState.score += 10;
                            eggScoreBadge.textContent = `EGGS: ${eggState.score}`;
                            spawnEggParticles(it.x, it.y, '#fef08a');
                            audioEngine.playEggCatchSound();
                        } else {
                            // Поймал проклятое светящееся бирюзовое яйцо -> урон
                            eggState.lives -= 1;
                            spawnEggParticles(it.x, it.y, '#2dd4bf');
                            audioEngine.playEggHurtSound();
                            if (eggState.lives <= 0) {
                                triggerEggJumpscare();
                                return;
                            }
                        }
                        eggState.items.splice(i, 1);
                        continue;
                    }

                    // Упало на землю
                    if (it.y > groundY + 4) {
                        if (it.type === 'normal') {
                            // Пропущенное белое яйцо разбивается и отнимает 1 сердце
                            eggState.lives -= 1;
                            spawnEggParticles(it.x, groundY, '#f8fafc');
                            audioEngine.playEggHurtSound();
                            if (eggState.lives <= 0) {
                                triggerEggJumpscare();
                                return;
                            }
                        }
                        eggState.items.splice(i, 1);
                    }
                }
            } else if (eggState.phase === 'jumpscare') {
                if (eggState.jumpscareProgress < 1) {
                    eggState.jumpscareProgress = Math.min(1, eggState.jumpscareProgress + dt * 5.6);
                } else {
                    eggState.jumpscareHoldTimer += dt;
                    if (eggState.jumpscareHoldTimer > 1.35) {
                        resetEggGameToTitle();
                    }
                }
            }
        }

        function drawPixelHeart(ctx, cx, cy, filled) {
            ctx.fillStyle = filled ? '#5eead4' : '#1b261e';
            ctx.strokeStyle = '#0f1712';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(cx, cy + 5);
            ctx.lineTo(cx - 6, cy - 1);
            ctx.lineTo(cx - 6, cy - 4);
            ctx.lineTo(cx - 3, cy - 6);
            ctx.lineTo(cx, cy - 3);
            ctx.lineTo(cx + 3, cy - 6);
            ctx.lineTo(cx + 6, cy - 4);
            ctx.lineTo(cx + 6, cy - 1);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            if (filled) {
                ctx.fillStyle = '#ccfbf1';
                ctx.fillRect(cx - 4, cy - 4, 2, 2);
            }
        }

        function drawPixelEggSprite(ctx, cx, cy, scale = 1, isCursed = false) {
            ctx.save();
            ctx.translate(Math.round(cx), Math.round(cy));
            ctx.scale(scale, scale);

            if (isCursed) {
                // Свечение проклятого яйца
                ctx.fillStyle = 'rgba(45, 212, 191, 0.35)';
                ctx.fillRect(-8, -10, 16, 20);
            }

            // Тёмный пиксельный контур
            ctx.fillStyle = '#111a13';
            ctx.fillRect(-5, -8, 10, 16);
            ctx.fillRect(-7, -5, 14, 11);
            ctx.fillRect(-6, -7, 12, 14);

            // Основной цвет яйца
            ctx.fillStyle = isCursed ? '#2dd4bf' : '#e8f5e9';
            ctx.fillRect(-4, -7, 8, 14);
            ctx.fillRect(-6, -4, 12, 9);
            ctx.fillRect(-5, -6, 10, 12);

            // Тень справа-снизу и блик слева-сверху
            ctx.fillStyle = isCursed ? '#0f766e' : '#a7d7b8';
            ctx.fillRect(2, -4, 3, 9);
            ctx.fillRect(-2, 5, 6, 2);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-3, -5, 2, 4);

            ctx.restore();
        }

        function drawPixelCharacter(ctx, x, y, dir, walkFrame) {
            ctx.save();
            ctx.translate(Math.round(x), Math.round(y));

            // Тень на земле
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.fillRect(-7, 15, 14, 3);

            // Ноги
            const step = Math.sin(walkFrame) * 3;
            ctx.fillStyle = '#142117';
            ctx.fillRect(-4, 8 + (step > 0 ? -1 : 0), 3, 7);
            ctx.fillRect(1, 8 + (step < 0 ? -1 : 0), 3, 7);

            // Бирюзовая рубашка
            ctx.fillStyle = '#111a13';
            ctx.fillRect(-6, -1, 12, 10);
            ctx.fillStyle = '#2dd4bf';
            ctx.fillRect(-5, 0, 10, 8);

            // Руки
            ctx.fillStyle = '#e8f5e9';
            ctx.fillRect(-7, 1, 2, 6);
            ctx.fillRect(5, 1, 2, 6);

            // Белый круглый шлем / голова
            ctx.fillStyle = '#111a13';
            ctx.fillRect(-6, -12, 12, 11);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(-5, -11, 10, 9);

            // Глаза
            ctx.fillStyle = '#0f1712';
            const eyeOffset = dir > 0 ? 1 : -1;
            ctx.fillRect(-3 + eyeOffset, -8, 2, 3);
            ctx.fillRect(1 + eyeOffset, -8, 2, 3);

            ctx.restore();
        }

        function drawScreamerFace(ctx, progress) {
            const offsetY = (1 - progress) * 185;
            ctx.save();
            ctx.translate(100, 104 + offsetY);

            const shakeX = (Math.random() - 0.5) * 6;
            const shakeY = (Math.random() - 0.5) * 6;
            ctx.translate(shakeX, shakeY);

            // Тёмный внешний контур
            ctx.fillStyle = '#060a07';
            ctx.beginPath();
            ctx.arc(0, 0, 62, 0, Math.PI * 2);
            ctx.fill();

            // Белое лицо
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.arc(0, 0, 56, 0, Math.PI * 2);
            ctx.fill();

            // Пустые тёмные глаза
            ctx.fillStyle = '#090d0a';
            ctx.fillRect(-26, -24, 14, 18);
            ctx.fillRect(12, -24, 14, 18);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-21, -18, 4, 4);
            ctx.fillRect(17, -18, 4, 4);

            // Широкая зубастая улыбка
            ctx.fillStyle = '#090d0a';
            ctx.beginPath();
            ctx.arc(0, 6, 38, 0.12 * Math.PI, 0.88 * Math.PI);
            ctx.lineTo(-34, 14);
            ctx.closePath();
            ctx.fill();

            // Полоски зубов
            ctx.fillStyle = '#f8fafc';
            for (let tx = -24; tx <= 20; tx += 8) {
                ctx.fillRect(tx, 16, 4, 14);
            }

            ctx.restore();
        }

        function renderEggGame() {
            const w = 200;
            const h = 200;
            eggCtx.imageSmoothingEnabled = false;
            eggCtx.clearRect(0, 0, w, h);

            if (eggState.phase === 'title') {
                // Тёмно-шалфейный фон титульного экрана EGG
                eggCtx.fillStyle = '#354236';
                eggCtx.fillRect(0, 0, w, h);

                // Тонкая внутренняя рамка
                eggCtx.strokeStyle = '#68856d';
                eggCtx.lineWidth = 2;
                eggCtx.strokeRect(16, 38, 168, 126);

                // Крупный округлый логотип "EGG" по центру
                eggCtx.save();
                eggCtx.font = '900 46px "Inter", sans-serif';
                eggCtx.textAlign = 'center';
                eggCtx.textBaseline = 'middle';

                eggCtx.lineWidth = 8;
                eggCtx.strokeStyle = '#111a13';
                eggCtx.strokeText('EGG', 100, 92);

                eggCtx.lineWidth = 3;
                eggCtx.strokeStyle = '#a7f3d0';
                eggCtx.strokeText('EGG', 100, 92);

                eggCtx.fillStyle = '#e8f5e9';
                eggCtx.fillText('EGG', 100, 92);
                eggCtx.restore();

                // Два пиксельных яйца снизу слева и справа
                const bob = Math.sin(performance.now() / 260) * 2;
                drawPixelEggSprite(eggCtx, 44, 134 + bob, 1.35, false);
                drawPixelEggSprite(eggCtx, 156, 134 - bob, 1.35, false);

            } else {
                // Мятно-зеленое небо
                eggCtx.fillStyle = '#82bc8e';
                eggCtx.fillRect(14, 38, 172, 128);

                // Светлое пиксельное облако в верхней центральной части
                eggCtx.fillStyle = '#d1fae5';
                eggCtx.beginPath();
                eggCtx.arc(100, 84, 26, 0, Math.PI * 2);
                eggCtx.arc(76, 90, 18, 0, Math.PI * 2);
                eggCtx.arc(124, 90, 18, 0, Math.PI * 2);
                eggCtx.fill();

                // Многослойные зелёные холмы / кусты на фоне
                eggCtx.fillStyle = '#5fa370';
                eggCtx.beginPath();
                eggCtx.arc(46, 146, 30, Math.PI, 0);
                eggCtx.arc(102, 146, 36, Math.PI, 0);
                eggCtx.arc(156, 146, 28, Math.PI, 0);
                eggCtx.fill();

                // Жуткий глаз в центре облака
                if (eggState.eyeAlpha > 0.02) {
                    eggCtx.save();
                    eggCtx.globalAlpha = eggState.eyeAlpha * 0.92;
                    eggCtx.strokeStyle = '#111a13';
                    eggCtx.fillStyle = '#ecfdf5';
                    eggCtx.lineWidth = 2.5;
                    eggCtx.beginPath();
                    eggCtx.moveTo(80, 88);
                    eggCtx.quadraticCurveTo(100, 72, 120, 88);
                    eggCtx.quadraticCurveTo(100, 104, 80, 88);
                    eggCtx.fill();
                    eggCtx.stroke();

                    eggCtx.fillStyle = '#0f766e';
                    eggCtx.beginPath();
                    eggCtx.arc(100, 88, 6, 0, Math.PI * 2);
                    eggCtx.fill();

                    eggCtx.fillStyle = '#111a13';
                    eggCtx.beginPath();
                    eggCtx.arc(100, 88, 2.5, 0, Math.PI * 2);
                    eggCtx.fill();
                    eggCtx.restore();
                }

                // Тёмно-зелёная земля снизу
                eggCtx.fillStyle = '#2d5a36';
                eggCtx.fillRect(14, 152, 172, 14);
                eggCtx.fillStyle = '#1a3820';
                eggCtx.fillRect(14, 152, 172, 2);

                // 3 пиксельных сердца сверху по центру
                drawPixelHeart(eggCtx, 82, 52, eggState.lives >= 1);
                drawPixelHeart(eggCtx, 100, 52, eggState.lives >= 2);
                drawPixelHeart(eggCtx, 118, 52, eggState.lives >= 3);

                // Падающие яйца
                for (const it of eggState.items) {
                    drawPixelEggSprite(eggCtx, it.x, it.y, 1.0, it.type === 'cursed');
                }

                // Игрок снизу
                drawPixelCharacter(eggCtx, eggState.playerX, 142, eggState.playerDir, eggState.walkFrame);

                // Частицы искр / скорлупы
                for (const p of eggState.particles) {
                    eggCtx.fillStyle = p.color;
                    eggCtx.fillRect(Math.round(p.x), Math.round(p.y), 3, 3);
                }

                // Скример улыбающейся рожицы при проигрыше
                if (eggState.phase === 'jumpscare') {
                    drawScreamerFace(eggCtx, eggState.jumpscareProgress);
                }
            }
        }

        // Прямая кнопка старта внутри HUD
        eggStartTriggerBtn.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (MODES[currentModeIdx].id === 'egg_game' && eggState.phase === 'title') {
                startEggGamePlay();
            }
        });
        eggStartTriggerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (MODES[currentModeIdx].id === 'egg_game' && eggState.phase === 'title') {
                startEggGamePlay();
            }
        });

        // Обработка касаний и перетаскивания по всему игровому экрану (без блокировок)
        function handleEggCanvasPointer(e) {
            if (MODES[currentModeIdx].id !== 'egg_game') return;
            e.preventDefault();
            e.stopPropagation();

            if (eggState.phase === 'title') {
                startEggGamePlay();
                return;
            }
            if (eggState.phase === 'playing') {
                const rect = eggCanvas.getBoundingClientRect();
                const normX = ((e.clientX - rect.left) / rect.width) * 200;
                eggState.targetTouchX = Math.max(26, Math.min(174, normX));
            }
        }

        eggCanvas.addEventListener('pointerdown', handleEggCanvasPointer);
        eggCanvas.addEventListener('pointermove', (e) => {
            if (MODES[currentModeIdx].id !== 'egg_game') return;
            if (eggState.phase === 'playing' && (e.buttons > 0 || e.pointerType === 'touch')) {
                const rect = eggCanvas.getBoundingClientRect();
                const normX = ((e.clientX - rect.left) / rect.width) * 200;
                eggState.targetTouchX = Math.max(26, Math.min(174, normX));
            }
        });

        const clearEggTouch = () => {
            eggState.targetTouchX = null;
            eggState.moveLeft = false;
            eggState.moveRight = false;
        };
        eggCanvas.addEventListener('pointerup', clearEggTouch);
        eggCanvas.addEventListener('pointercancel', clearEggTouch);
        eggCanvas.addEventListener('touchend', clearEggTouch, { passive: true });

        // Клавиатурное управление (E / Space / Enter / Стрелки / A / D)
        window.addEventListener('keydown', (e) => {
            if (MODES[currentModeIdx].id !== 'egg_game') return;
            if (eggState.phase === 'title' && (e.key === 'e' || e.key === 'E' || e.key === ' ' || e.key === 'Enter')) {
                e.preventDefault();
                startEggGamePlay();
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                eggState.targetTouchX = null;
                eggState.moveLeft = true;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                eggState.targetTouchX = null;
                eggState.moveRight = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                eggState.moveLeft = false;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                eggState.moveRight = false;
            }
        });

        /**
         * =========================================================================
         * ПЕРЕКЛЮЧЕНИЕ МЕЖДУ 6 СОСТОЯНИЯМИ СКАНЕРА
         * =========================================================================
         */
        let modeSwitchNonce = 0;

        async function setScannerMode(newIndex, direction = 'next') {
            const prevIdx = currentModeIdx;
            currentModeIdx = (newIndex + MODES.length) % MODES.length;
            const mode = MODES[currentModeIdx];
            const currentNonce = ++modeSwitchNonce;

            triggerScreenTransition();

            chassisModeLabel.textContent = mode.label;
            chassisLed.className = `w-2.5 h-2.5 rounded-full transition-all duration-200 ${mode.led}`;
            hudTitle.textContent = mode.title;
            hudSubtitle.textContent = mode.subtitle;

            if (mode.id === 'off') {
                audioEngine.stopAll();
                if (prevIdx !== 0) {
                    audioEngine.playCloseSound();
                }
            } else {
                if (prevIdx === 0) {
                    audioEngine.playOpenSound();
                } else {
                    audioEngine.playSwitchSound(direction);
                }

                audioEngine.startScannerPulseLoop(mode.id);

                if (mode.id === 'item_radar' || mode.id === 'egg_game') {
                    audioEngine.stopAmbienceSound();
                } else {
                    audioEngine.startAmbienceSound();
                }
            }

            stopDetectionLoops();
            stopEggGameLoop();
            hideCameraError();

            if (mode.id !== 'torch') {
                await turnOffTorchOnly();
            }
            if (currentNonce !== modeSwitchNonce) return;

            centerItemRadarView.classList.add('hidden');
            centerItemRadarView.classList.remove('flex');
            centerTorchView.classList.add('hidden');
            centerTranslateView.classList.add('hidden');
            centerTranslateView.classList.remove('flex');
            centerRadarView.classList.add('hidden');
            centerRadarView.classList.remove('flex');
            centerEggView.classList.add('hidden');
            centerEggView.classList.remove('flex');

            hudFooterContainer.classList.remove('hidden');
            footerTorchInfo.classList.add('hidden');
            scanOcrBtn.classList.add('hidden');
            videoEl.classList.add('hidden');

            if (mode.id === 'off') {
                await stopAllHardware();
                if (currentNonce !== modeSwitchNonce) return;
                scannerDisplay.className = 'scanner-display state-off w-full h-full flex items-center justify-center';
                screenActive.classList.add('hidden');
                screenOff.classList.remove('hidden');
            } else {
                screenOff.classList.add('hidden');
                screenActive.classList.remove('hidden');

                if (mode.id === 'item_radar') {
                    updateHudTheme('green', mode.bars);
                    hudFooterContainer.classList.add('hidden');
                    centerItemRadarView.classList.remove('hidden');
                    centerItemRadarView.classList.add('flex');
                    await activateItemRadar();

                } else if (mode.id === 'torch') {
                    updateHudTheme('white', mode.bars);
                    centerTorchView.classList.remove('hidden');
                    footerTorchInfo.classList.remove('hidden');
                    await activateTorch();

                } else if (mode.id === 'translate') {
                    updateHudTheme('purple', mode.bars);
                    centerTranslateView.classList.remove('hidden');
                    centerTranslateView.classList.add('flex');
                    scanOcrBtn.classList.remove('hidden');
                    translationResultBox.classList.add('hidden');

                    const res = await ensureCameraStream();
                    if (currentNonce !== modeSwitchNonce) return;
                    if (res.ok) {
                        videoEl.classList.remove('hidden', 'green-vision', 'crimson-vision');
                        videoEl.classList.add('purple-vision');
                    } else {
                        showCameraError(res.reason);
                    }

                } else if (mode.id === 'radar') {
                    updateHudTheme('crimson', mode.bars);
                    centerRadarView.classList.remove('hidden');
                    centerRadarView.classList.add('flex');
                    await activatePeopleRadar();

                } else if (mode.id === 'egg_game') {
                    // Останавливаем камеру при входе в мини-игру, чтобы погасить индикатор камеры
                    await stopAllHardware();
                    if (currentNonce !== modeSwitchNonce) return;
                    updateHudTheme('egg', mode.bars);
                    hudFooterContainer.classList.add('hidden');
                    centerEggView.classList.remove('hidden');
                    centerEggView.classList.add('flex');
                    startEggGameLoop();
                }
            }
        }

        /**
         * =========================================================================
         * ОБРАБОТКА ТАКТИЛЬНЫХ ТРЕУГОЛЬНЫХ КНОПОК + КНОПОК СМЕНЫ РЕЖИМА ◄ ►
         * =========================================================================
         */
        let lastTapTimestamp = 0;

        function bindReliableTactileButton(buttonEl, direction, delta, rippleColor) {
            let pressTimer = null;

            const spawnRipple = () => {
                const ripple = document.createElement('span');
                ripple.className = 'btn-ripple-ring';
                ripple.style.border = `2.5px solid ${rippleColor}`;
                ripple.style.boxShadow = `0 0 14px ${rippleColor}`;
                buttonEl.appendChild(ripple);
                setTimeout(() => {
                    if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
                }, 380);
            };

            const handleActivation = (e) => {
                if (e.type === 'pointerdown' && e.button !== undefined && e.button !== 0) return;

                const now = performance.now();
                if (now - lastTapTimestamp < 65) return;
                lastTapTimestamp = now;

                buttonEl.classList.add('is-pressed');
                spawnRipple();

                if (pressTimer) clearTimeout(pressTimer);
                pressTimer = setTimeout(() => {
                    buttonEl.classList.remove('is-pressed');
                }, 115);

                if (navigator.vibrate) {
                    try { navigator.vibrate(18); } catch (err) {}
                }

                // В режиме 6 (EGG): на титульном экране кнопка сразу запускает игру,
                // а во время игры управляет движением влево/вправо!
                if (MODES[currentModeIdx].id === 'egg_game') {
                    if (eggState.phase === 'title') {
                        startEggGamePlay();
                        return;
                    }
                    if (eggState.phase === 'playing') {
                        eggState.targetTouchX = null;
                        if (direction === 'prev') {
                            eggState.moveLeft = true;
                            eggState.moveRight = false;
                        } else {
                            eggState.moveRight = true;
                            eggState.moveLeft = false;
                        }
                        return;
                    }
                }

                // В режимах 1–5 треугольные кнопки переключают режимы
                setScannerMode(currentModeIdx + delta, direction);
            };

            const clearPressed = () => {
                buttonEl.classList.remove('is-pressed');
                if (direction === 'prev') eggState.moveLeft = false;
                if (direction === 'next') eggState.moveRight = false;
            };

            buttonEl.addEventListener('pointerdown', handleActivation);
            buttonEl.addEventListener('pointerup', clearPressed);
            buttonEl.addEventListener('pointercancel', clearPressed);
            buttonEl.addEventListener('pointerleave', clearPressed);
            buttonEl.addEventListener('touchend', clearPressed, { passive: true });
            buttonEl.addEventListener('touchcancel', clearPressed, { passive: true });
        }

        bindReliableTactileButton(document.getElementById('btn-prev'), 'prev', -1, 'rgba(248, 113, 113, 0.9)');
        bindReliableTactileButton(document.getElementById('btn-next'), 'next', +1, 'rgba(134, 239, 172, 0.9)');

        // Компактные кнопки ◄ ► на плашке режима для переключения из мини-игры EGG в любой момент
        document.getElementById('mini-prev-mode').addEventListener('click', () => {
            setScannerMode(currentModeIdx - 1, 'prev');
        });
        document.getElementById('mini-next-mode').addEventListener('click', () => {
            setScannerMode(currentModeIdx + 1, 'next');
        });

        // Кнопки оверлея ошибки камеры
        document.getElementById('retry-btn').addEventListener('click', () => {
            setScannerMode(currentModeIdx, 'next');
        });
        document.getElementById('dismiss-error-btn').addEventListener('click', () => {
            hideCameraError();
        });

        // Инициализация в выключенном состоянии
        setScannerMode(0, 'next');
    </script>
</body>
</html>
